<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA World Cup 2026 — Prediction Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C; --gold-light: #F0D080;
    --dark: #0a0f0d; --darker: #060908;
    --white: #f5f0e8; --muted: #7a9080;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--darker); color:var(--white); font-family:'Barlow',sans-serif; min-height:100vh; overflow-x:hidden; }

header {
background:linear-gradient(135deg,#0a0f0d 0%,#0e2018 60%,#0a0f0d 100%);
border-bottom:2px solid var(–gold); padding:22px 36px;
display:flex; align-items:center; gap:18px; position:relative; overflow:hidden;
}
header::before { content:''; position:absolute; inset:0; background:repeating-linear-gradient(60deg,transparent,transparent 30px,rgba(201,168,76,.03) 30px,rgba(201,168,76,.03) 31px); }
.trophy { font-size:46px; filter:drop-shadow(0 0 18px rgba(201,168,76,.6)); }
header h1 { font-family:'Bebas Neue',sans-serif; font-size:clamp(24px,4vw,48px); letter-spacing:4px; color:var(–gold-light); line-height:1; text-shadow:0 0 40px rgba(201,168,76,.4); }
header p { font-family:'Barlow Condensed',sans-serif; color:var(–muted); font-size:11px; letter-spacing:3px; text-transform:uppercase; margin-top:3px; }
.hdr-right { margin-left:auto; display:flex; flex-direction:column; align-items:flex-end; gap:8px; z-index:1; }
.sim-btn { background:var(–gold); color:var(–darker); border:none; padding:10px 26px; font-family:'Bebas Neue',sans-serif; font-size:17px; letter-spacing:2px; cursor:pointer; transition:all .2s; }
.sim-btn:hover { background:var(–gold-light); transform:translateY(-2px); box-shadow:0 8px 28px rgba(201,168,76,.4); }
.sim-btn:active { transform:translateY(0); }
.var-row { display:flex; align-items:center; gap:7px; font-family:'Barlow Condensed',sans-serif; font-size:11px; color:var(–muted); letter-spacing:1px; }
.var-row input[type=range] { width:110px; accent-color:var(–gold); cursor:pointer; }

.progress-overlay { position:fixed; inset:0; background:rgba(6,9,8,.97); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:1000; transition:opacity .5s; }
.progress-overlay.hidden { opacity:0; pointer-events:none; }
.prog-title { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:6px; color:var(–gold); margin-bottom:18px; }
.prog-wrap { width:380px; max-width:80vw; height:5px; background:rgba(201,168,76,.1); border:1px solid rgba(201,168,76,.3); }
.prog-fill { height:100%; background:linear-gradient(90deg,var(–gold),var(–gold-light)); transition:width .25s; width:0%; }
.prog-sub { margin-top:9px; font-family:'Barlow Condensed',sans-serif; font-size:12px; letter-spacing:2px; color:var(–muted); }

main { max-width:1700px; margin:0 auto; padding:26px 18px; }
.section-label { font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:5px; color:var(–gold); text-transform:uppercase; margin-bottom:13px; display:flex; align-items:center; gap:12px; }
.section-label::after { content:''; flex:1; height:1px; background:linear-gradient(to right,rgba(201,168,76,.3),transparent); }

/* PODIUM */
.podium-section { background:linear-gradient(145deg,#0a1f12,#050e09); border:2px solid var(–gold); padding:34px 38px; text-align:center; position:relative; overflow:hidden; margin-bottom:34px; }
.podium-section::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at center,rgba(201,168,76,.08) 0%,transparent 70%); pointer-events:none; }
.pod-lbl { font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:6px; color:var(–gold); margin-bottom:12px; }
.champ-flag { font-size:58px; display:block; margin-bottom:9px; }
.champ-name { font-family:'Bebas Neue',sans-serif; font-size:clamp(42px,7vw,86px); color:var(–gold-light); letter-spacing:8px; text-shadow:0 0 60px rgba(201,168,76,.5); line-height:1; }
.champ-score { font-family:'Barlow Condensed',sans-serif; font-size:18px; color:var(–muted); margin-top:7px; letter-spacing:2px; }
.podium-row { display:flex; justify-content:center; gap:44px; margin-top:26px; flex-wrap:wrap; }
.pod-item { text-align:center; }
.pod-flag { font-size:28px; display:block; margin-bottom:3px; }
.pod-pos { font-family:'Bebas Neue',sans-serif; font-size:34px; line-height:1; }
.pod-pos.gold { color:var(–gold); }
.pod-pos.silver { color:#c0c0c0; }
.pod-pos.bronze { color:#cd7f32; }
.pod-pos.fourth { color:var(–muted); }
.pod-team { font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:600; margin-top:3px; }

/* GROUPS */
.groups-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(245px,1fr)); gap:13px; margin-bottom:34px; }
.group-card { background:linear-gradient(145deg,#0f1f16,#0a1510); border:1px solid rgba(201,168,76,.2); overflow:hidden; transition:border-color .2s; }
.group-card:hover { border-color:rgba(201,168,76,.45); }
.grp-hdr { background:linear-gradient(90deg,rgba(201,168,76,.12),transparent); border-bottom:1px solid rgba(201,168,76,.2); padding:8px 13px; }
.grp-letter { font-family:'Bebas Neue',sans-serif; font-size:24px; color:var(–gold); line-height:1; }
.grp-tbl { width:100%; border-collapse:collapse; }
.grp-tbl th { font-family:'Barlow Condensed',sans-serif; font-size:10px; letter-spacing:1px; color:var(–muted); text-transform:uppercase; padding:5px 6px; text-align:center; border-bottom:1px solid rgba(255,255,255,.05); }
.grp-tbl th:first-child { text-align:left; padding-left:13px; }
.grp-tbl td { padding:6px 6px; text-align:center; font-size:12px; font-family:'Barlow Condensed',sans-serif; border-bottom:1px solid rgba(255,255,255,.04); }
.grp-tbl td:first-child { text-align:left; padding-left:13px; }
.grp-tbl tr:last-child td { border-bottom:none; }
.pos-n { font-family:'Bebas Neue',sans-serif; font-size:12px; margin-right:4px; }
.p1{color:var(–gold);} .p2{color:#aaa;} .p3,.p4{color:var(–muted);}
.qualified { background:rgba(58,181,106,.07); }

/* GROUP MATCHES */
.group-matches-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:13px; margin-bottom:34px; }
.group-matches-card { background:linear-gradient(145deg,#0f1f16,#0a1510); border:1px solid rgba(201,168,76,.2); overflow:hidden; }
.group-matches-card .grp-hdr { background:linear-gradient(90deg,rgba(201,168,76,.12),transparent); border-bottom:1px solid rgba(201,168,76,.2); padding:8px 13px; }
.group-match { display:flex; align-items:center; justify-content:space-between; padding:7px 13px; border-bottom:1px solid rgba(255,255,255,.04); font-family:'Barlow Condensed',sans-serif; font-size:13px; }
.group-match:last-child { border-bottom:none; }
.gm-team { flex:1; display:flex; align-items:center; gap:6px; }
.gm-team.winner { font-weight:600; color:var(–gold-light); }
.gm-team.loser { color:var(–muted); opacity:.7; }
.gm-team.draw { color:var(–white); }
.gm-score { font-family:'Bebas Neue',sans-serif; font-size:20px; min-width:35px; text-align:center; color:var(–gold); }

/* KNOCKOUT */
.rounds-wrap { display:flex; gap:0; overflow-x:auto; padding-bottom:14px; margin-bottom:34px; }
.round-col { flex:0 0 auto; width:220px; }
.round-title { font-family:'Bebas Neue',sans-serif; font-size:11px; letter-spacing:3px; color:var(–gold); text-align:center; padding:8px 5px; background:rgba(201,168,76,.07); border-bottom:1px solid rgba(201,168,76,.2); border-right:1px solid rgba(201,168,76,.08); margin-bottom:11px; }
.match-card { background:linear-gradient(145deg,#0f1f16,#0a1510); border:1px solid rgba(201,168,76,.13); margin:0 5px 8px; padding:8px 10px; transition:border-color .2s; }
.match-card:hover { border-color:rgba(201,168,76,.38); }
.match-num { font-family:'Barlow Condensed',sans-serif; font-size:10px; color:rgba(201,168,76,.5); letter-spacing:2px; margin-bottom:5px; }
.match-team { display:flex; justify-content:space-between; align-items:center; padding:3px 0; font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:600; }
.match-team.winner { color:var(–gold-light); }
.match-team.loser { color:var(–muted); opacity:.65; }
.match-score { font-family:'Bebas Neue',sans-serif; font-size:18px; min-width:19px; text-align:center; }
.match-team.winner .match-score { color:var(–gold); }
.match-divider { height:1px; background:rgba(255,255,255,.06); margin:2px 0; }
.match-meta { font-size:9px; color:var(–muted); font-family:'Barlow Condensed',sans-serif; letter-spacing:1px; margin-top:3px; }

/* STATS */
.stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:13px; margin-bottom:34px; }
.stat-card { background:linear-gradient(145deg,#0f1f16,#0a1510); border:1px solid rgba(201,168,76,.2); padding:17px; }
.stat-card h3 { font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:3px; color:var(–gold); margin-bottom:13px; border-bottom:1px solid rgba(201,168,76,.2); padding-bottom:6px; }
.stat-row { display:flex; align-items:center; gap:9px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,.04); font-family:'Barlow Condensed',sans-serif; font-size:13px; }
.stat-row:last-child { border-bottom:none; }
.stat-rank { font-family:'Bebas Neue',sans-serif; font-size:14px; color:var(–gold); min-width:17px; }
.stat-player { flex:1; font-weight:600; }
.stat-country { color:var(–muted); font-size:11px; }
.stat-val { font-family:'Bebas Neue',sans-serif; font-size:20px; color:var(–gold-light); }

@media(max-width:768px){ header{padding:14px;} .stats-grid{grid-template-columns:1fr;} .round-col{width:170px;} .podium-row{gap:20px;} }
</style>

</head>

// ── Safe RNG (Mulberry32 — never produces 0, no infinite loops) ──
let _seed = 1;
function srng() {
  _seed |= 0; _seed = _seed + 0x6D2B79F5 | 0;
  let t = Math.imul(_seed ^ _seed >>> 15, 1 | _seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
function rng(lo=0, hi=1) { return lo + srng() * (hi - lo); }
function irand(lo, hi) { return Math.floor(lo + srng() * (hi - lo + 1)); }

// ── Poisson goals via lookup table (fast, no loop risk) ──────
function poissonGoals(lambda) {
  lambda = Math.max(0.1, Math.min(lambda, 8));
  const L = Math.exp(-lambda);
  let k = 0, p = 1;
  do { k++; p *= srng(); } while (p > L && k < 15);
  return k - 1;
}

// ── Monte Carlo simulation runs based on upset factor ────────
// 0% upset = 1000 runs (most accurate, picks most likely outcome)
// 100% upset = 1 run (least accurate, pure randomness)
// Linear distribution: runs = 1000 - (variance * 9.99)
function getMonteCarloRuns() {
  // Inverse relationship: lower upset = more simulations
  // Formula: 1000 runs at 0%, scales down to 1 run at 100%
  return Math.max(1, Math.round(1000 - (variance * 9.99)));
}

// ── Expected goals model with FIFA ranking + club strength ────
function calcXG(attacker, defender) {
  const ta = T[attacker], td = T[defender];
  
  const base = 1.15;
  const tacticalEdge = (ta.att - td.def) / 40;
  const fifaBonus = (50 - ta.fifa) / 200;
  const fifaPenalty = (td.fifa - 50) / 200;
  const clubEdge = (ta.clubStr - td.clubStr) / 50;
  const formFactor = (ta.r - 75) / 100;
  
  let xg = base + tacticalEdge + fifaBonus + fifaPenalty + clubEdge + formFactor;
  
  // Add variance based on slider
  const noise = (srng() - 0.5) * (variance / 100) * 1.6;
  xg += noise;
  
  return Math.max(0.15, Math.min(xg, 4.2));
}

// ── Monte Carlo Group Match Simulation ────────────────────────
function simGroupMatch(a, b) {
  const runs = getMonteCarloRuns();
  const scoreCounts = {};
  
  // Run multiple simulations
  for (let i = 0; i < runs; i++) {
    const goalsA = poissonGoals(calcXG(a, b));
    const goalsB = poissonGoals(calcXG(b, a));
    const key = `${goalsA}-${goalsB}`;
    scoreCounts[key] = (scoreCounts[key] || 0) + 1;
  }
  
  // Sort scores by frequency (most common first)
  const sortedScores = Object.entries(scoreCounts)
    .sort((a, b) => b[1] - a[1]);
  
  // Select score based on upset factor
  // 0% upset = index 0 (most likely)
  // 100% upset = last index (least likely)
  // 20% upset = 80% probability = index at 20% position
  const percentile = variance / 100;
  const targetIndex = Math.floor(percentile * (sortedScores.length - 1));
  const selectedScore = sortedScores[targetIndex][0];
  
  const [goalsA, goalsB] = selectedScore.split('-').map(Number);
  return { goalsA, goalsB };
}

// ── Monte Carlo Knockout Match Simulation ─────────────────────
function simKO(a, b) {
  const runs = getMonteCarloRuns();
  const outcomeCounts = {};
  
  // Run multiple simulations
  for (let i = 0; i < runs; i++) {
    const result = simSingleKO(a, b);
    const key = `${result.goalsA}-${result.goalsB}-${result.aet}-${result.pens?.a || 'n'}-${result.pens?.b || 'n'}-${result.winner}`;
    
    if (!outcomeCounts[key]) {
      outcomeCounts[key] = { ...result, count: 0 };
    }
    outcomeCounts[key].count++;
  }
  
  // Sort outcomes by frequency (most common first)
  const sortedOutcomes = Object.values(outcomeCounts)
    .sort((a, b) => b.count - a.count);
  
  // Select outcome based on upset factor
  // 0% upset = index 0 (most likely)
  // 100% upset = last index (least likely)
  // 20% upset = 80% probability = index at 20% position
  const percentile = variance / 100;
  const targetIndex = Math.floor(percentile * (sortedOutcomes.length - 1));
  const selectedOutcome = sortedOutcomes[targetIndex];
  
  const { goalsA, goalsB, aet, pens, winner } = selectedOutcome;
  return { goalsA, goalsB, aet, pens, winner };
}

// ── Single knockout simulation (used by Monte Carlo) ──────────
function simSingleKO(a, b) {
  let goalsA = poissonGoals(calcXG(a, b));
  let goalsB = poissonGoals(calcXG(b, a));
  let aet = false, pens = null;
  
  if (goalsA === goalsB) {
    aet = true;
    const aetChance = 0.25 + (T[a].r - T[b].r) / 400;
    if (srng() < aetChance) {
      const aProb = (100 - T[a].fifa) / (200 - T[a].fifa - T[b].fifa);
      srng() < aProb ? goalsA++ : goalsB++;
    }
    if (goalsA === goalsB) {
      const baseAcc = 0.70;
      const accA = Math.min(0.85, baseAcc + (100 - T[a].fifa) / 300 + T[a].clubStr / 300);
      const accB = Math.min(0.85, baseAcc + (100 - T[b].fifa) / 300 + T[b].clubStr / 300);
      let pA = 0, pB = 0;
      for (let i = 0; i < 5; i++) { if (srng() < accA) pA++; if (srng() < accB) pB++; }
      let sdRounds = 0;
      while (pA === pB && sdRounds < 20) {
        if (srng() < accA) pA++;
        if (srng() < accB) pB++;
        sdRounds++;
      }
      if (pA === pB) { T[a].fifa <= T[b].fifa ? pA++ : pB++; }
      pens = { a: pA, b: pB };
    }
  }
  const winner = pens ? (pens.a > pens.b ? a : b) : (goalsA > goalsB ? a : b);
  return { goalsA, goalsB, aet, pens, winner };
}

// ── Scorers ───────────────────────────────────────────────────
let scorers = {}, assists = {};
function logGoals(team, goals) {
  if (!goals) return;
  const st = T[team].stars;
  for (let i = 0; i < goals; i++) {
    const sc = st[irand(0, st.length - 1)];
    scorers[sc] = (scorers[sc] || 0) + 1;
    if (!scorers[sc + '_t']) scorers[sc + '_t'] = team;
    let as = st[irand(0, st.length - 1)];
    assists[as] = (assists[as] || 0) + 1;
    if (!assists[as + '_t']) assists[as + '_t'] = team;
  }
}

// ── Group stage ───────────────────────────────────────────────
function runGroups() {
  SIM.groups = {}; SIM.thirds = [];
  
  // Initialize groups
  Object.entries(GROUPS).forEach(([g, teams]) => {
    const st = {};
    teams.forEach(t => { st[t] = { w:0, d:0, l:0, gf:0, ga:0, pts:0 }; });
    SIM.groups[g] = { ranked: [], stats: st, matches: [] };
  });
  
  // Play matches in official calendar order (matches 1-72)
  for (let matchNum = 1; matchNum <= 72; matchNum++) {
    const sched = GROUP_SCHEDULE[matchNum];
    const teams = GROUPS[sched.g];
    const a = teams[sched.t1], b = teams[sched.t2];

    // Use real result if available, otherwise simulate
    const real = REAL_RESULTS[matchNum];
    const { goalsA, goalsB } = real ? real : simGroupMatch(a, b);
    
    logGoals(a, goalsA); logGoals(b, goalsB);
    
    const grp = SIM.groups[sched.g];
    grp.matches.push({ num: matchNum, a, b, goalsA, goalsB, date: sched.d });
    
    const st = grp.stats;
    st[a].gf += goalsA; st[a].ga += goalsB;
    st[b].gf += goalsB; st[b].ga += goalsA;
    if (goalsA > goalsB)      { st[a].w++; st[a].pts += 3; st[b].l++; }
    else if (goalsB > goalsA) { st[b].w++; st[b].pts += 3; st[a].l++; }
    else                      { st[a].d++; st[b].d++; st[a].pts++; st[b].pts++; }
  }
  
  // Rank teams in each group
  Object.entries(GROUPS).forEach(([g, teams]) => {
    const st = SIM.groups[g].stats;
    const matches = SIM.groups[g].matches;

    // Build head-to-head lookup for this group
    // h2h[a][b] = { pts: points a earned vs b, gd: goal diff a vs b }
    const h2h = {};
    teams.forEach(t => { h2h[t] = {}; });
    matches.forEach(m => {
      const a = m.a, b = m.b;
      const aGd = m.goalsA - m.goalsB;
      const aPts = m.goalsA > m.goalsB ? 3 : m.goalsA === m.goalsB ? 1 : 0;
      const bPts = m.goalsB > m.goalsA ? 3 : m.goalsA === m.goalsB ? 1 : 0;
      h2h[a][b] = { pts: aPts, gd:  aGd };
      h2h[b][a] = { pts: bPts, gd: -aGd };
    });

    const ranked = [...teams].sort((a, b) => {
      // 1. Overall points
      if (st[b].pts !== st[a].pts) return st[b].pts - st[a].pts;
      // 2. Head-to-head points (direct game between a and b)
      const h2hA = h2h[a][b]?.pts ?? 0;
      const h2hB = h2h[b][a]?.pts ?? 0;
      if (h2hB !== h2hA) return h2hB - h2hA;
      // 3. Head-to-head goal difference
      const h2hGdA = h2h[a][b]?.gd ?? 0;
      const h2hGdB = h2h[b][a]?.gd ?? 0;
      if (h2hGdB !== h2hGdA) return h2hGdB - h2hGdA;
      // 4. Overall goal difference
      const gdA = st[a].gf - st[a].ga, gdB = st[b].gf - st[b].ga;
      if (gdB !== gdA) return gdB - gdA;
      // 5. Overall goals scored
      return st[b].gf - st[a].gf;
    });
    SIM.groups[g].ranked = ranked;
    
    const t3 = ranked[2];
    SIM.thirds.push({ team: t3, grp: g, pts: st[t3].pts, gd: st[t3].gf - st[t3].ga, gf: st[t3].gf });
  });
  
  SIM.thirds.sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
  SIM.b8 = SIM.thirds.slice(0, 8);
}

function G1(g) { return SIM.groups[g].ranked[0]; }
function G2(g) { return SIM.groups[g].ranked[1]; }

const usedThirds = new Set();
function bestThird(groupSet) {
  for (const entry of SIM.b8) {
    if (groupSet.includes(entry.grp) && !usedThirds.has(entry.team)) {
      usedThirds.add(entry.team); return entry.team;
    }
  }
  for (const entry of SIM.thirds) {
    if (!usedThirds.has(entry.team)) { usedThirds.add(entry.team); return entry.team; }
  }
  return SIM.thirds[0].team;
}

function koMatch(num, a, b) {
  const real = PAIR_RESULTS[`${a}|${b}`];
  let res, played;
  if (real) {
    const winner = real.pens
      ? (real.pens.a > real.pens.b ? a : b)
      : (real.goalsA > real.goalsB ? a : b);
    res = { goalsA: real.goalsA, goalsB: real.goalsB, aet: real.aet, pens: real.pens, winner };
    played = true;
  } else {
    res = simKO(a, b);
    played = false;
  }
  logGoals(a, res.goalsA); logGoals(b, res.goalsB);
  return { num, a, b, ...res, played };
}

// ── Knockout with exact schedule match numbers ────────────────
function runKnockout() {
  usedThirds.clear();
  const R = {};

  // If every one of the 72 group matches is a real result, we know the true
  // Round of 32 bracket — use the actual confirmed matchups instead of our
  // own approximate third-place assignment algorithm.
  const allGroupsReal = Array.from({length:72}, (_,i) => i+1).every(n => REAL_RESULTS[n] !== undefined);

  if (allGroupsReal) {

    R[73]=koMatch(73, G2("A"), G2("B"));  // 2A v 2B
    R[74]=koMatch(74, G1("E"), bestThird(["A","B","C","D","F"]));  // 1E v 3(ABCDF)
    R[75]=koMatch(75, G1("F"), G2("C"));  // 1F v 2C
    R[76]=koMatch(76, G1("C"), G2("F"));  // 1C v 2F
    R[77]=koMatch(77, G1("I"), bestThird(["C","D","F","G","H"]));  // 1I v 3(CDFGH)
    R[78]=koMatch(78, G2("E"), G2("I"));  // 2E v 2I
    R[79]=koMatch(79, G1("A"), bestThird(["C","E","F","H","I"]));  // 1A v 3(CEFHI)
    R[80]=koMatch(80, G1("L"), bestThird(["E","H","I","J","K"]));  // 1L v 3(EHIJK)
    R[81]=koMatch(81, G1("D"), bestThird(["B","E","F","I","J"]));  // 1D v 3(BEFIJ)
    R[82]=koMatch(82, G1("G"), bestThird(["A","E","H","I","J"]));  // 1G v 3(AEHIJ)
    R[83]=koMatch(83, G2("K"), G2("L"));  // 2K v 2L
    R[84]=koMatch(84, G1("H"), G2("J"));  // 1H v 2J
    R[85]=koMatch(85, G1("B"), bestThird(["E","F","G","I","J"]));  // 1B v 3(EFGIJ)
    R[86]=koMatch(86, G1("J"), G2("H"));  // 1J v 2H
    R[87]=koMatch(87, G1("K"), bestThird(["D","E","I","J","L"]));  // 1K v 3(DEIJL)
    R[88]=koMatch(88, G2("D"), G2("G"));  // 2D v 2G
  }
  // Round of 16 (89–96)
  R[89]=koMatch(89, R[74].winner, R[77].winner);
  R[90]=koMatch(90, R[73].winner, R[75].winner);  // W73 v W75
  R[91]=koMatch(91, R[76].winner, R[78].winner);  // W76 v W78
  R[92]=koMatch(92, R[79].winner, R[80].winner);
  R[93]=koMatch(93, R[83].winner, R[84].winner);
  R[94]=koMatch(94, R[81].winner, R[82].winner);  // W81 v W82 (corrected)
  R[95]=koMatch(95, R[86].winner, R[88].winner);  // W86 v W88
  R[96]=koMatch(96, R[85].winner, R[87].winner);  // W85 v W87 (corrected)
  // Quarter-Finals (97–100)
  R[97]=koMatch(97,  R[89].winner, R[90].winner);
  R[98]=koMatch(98,  R[93].winner, R[94].winner);  // W93 v W94 (corrected)
  R[99]=koMatch(99,  R[91].winner, R[92].winner);
  R[100]=koMatch(100, R[95].winner, R[96].winner);  // W95 v W96 (corrected)
  // Semi-Finals (101–102)
  R[101]=koMatch(101, R[97].winner,  R[98].winner);
  R[102]=koMatch(102, R[99].winner,  R[100].winner);
  // Bronze Final (103) — losers of semis
  const sf1L = R[101].a === R[101].winner ? R[101].b : R[101].a;
  const sf2L = R[102].a === R[102].winner ? R[102].b : R[102].a;
  R[103]=koMatch(103, sf1L, sf2L);
  // Final (104)
  R[104]=koMatch(104, R[101].winner, R[102].winner);
  SIM.ko = R;

// ── Resolve a competitor object to our team code ──────────────
function resolveCode(c) {
  const abbr = (c.team?.abbreviation || '').toUpperCase();
  const name  = c.team?.displayName || c.team?.name || c.team?.shortDisplayName || '';
  // 1. If abbreviation is already a valid code, use it directly
  if (VALID_CODES.has(abbr)) return abbr;
  // 2. Look up in the map by abbreviation
  if (ESPN_NAME_MAP[abbr]) return ESPN_NAME_MAP[abbr];
  // 3. Look up by display name
  if (ESPN_NAME_MAP[name]) return ESPN_NAME_MAP[name];
  return null;
}

// ── Build team-pair → match number lookup ─────────────────────
function buildMatchLookup() {
  const lookup = {};
  for (const [num, sched] of Object.entries(GROUP_SCHEDULE)) {
    const teams = GROUPS[sched.g];
    const a = teams[sched.t1], b = teams[sched.t2];
    lookup[`${a}|${b}`] = { num: +num, swap: false };
    lookup[`${b}|${a}`] = { num: +num, swap: true  };
  }
  return lookup;
}

// ── Fetch live results: ESPN (date range) → FIFA API → hardcoded ─
async function fetchLiveResults() {
  const sub = document.getElementById("progSub");
  const bar = document.getElementById("progBar");
  sub.textContent = "Fetching live results...";
  bar.style.width = "5%";

  const lookup = buildMatchLookup();

  // Start from known knockout results; live data will overlay/extend this
  PAIR_RESULTS = { ...FALLBACK_PAIR_RESULTS };

  // Helper: parse ESPN events array into our group-stage results object (matches 1-72)
  function parseESPN(events) {
    const out = {};
    for (const event of events) {
      const comp = event.competitions?.[0];
      if (!comp) continue;
      const s = comp.status?.type;
      const done = s?.completed === true || s?.state === 'post'
                || s?.name === 'STATUS_FINAL' || s?.description === 'Final';
      if (!done) continue;
      const [c1, c2] = comp.competitors || [];
      if (!c1 || !c2) continue;
      const codeA = resolveCode(c1), codeB = resolveCode(c2);
      if (!codeA || !codeB) continue;
      const entry = lookup[`${codeA}|${codeB}`];
      if (!entry) continue;
      const sA = parseInt(c1.score), sB = parseInt(c2.score);
      if (isNaN(sA) || isNaN(sB)) continue;
      out[entry.num] = entry.swap ? { goalsA: sB, goalsB: sA } : { goalsA: sA, goalsB: sB };
    }
    return out;
  }

  // Helper: parse ANY completed match (group or knockout) into a team-pair lookup
  function parsePairResults(events) {
    const out = {};
    for (const event of events) {
      const comp = event.competitions?.[0];
      if (!comp) continue;
      const s = comp.status?.type;
      const done = s?.completed === true || s?.state === 'post'
                || s?.name === 'STATUS_FINAL' || s?.description === 'Final';
      if (!done) continue;
      const [c1, c2] = comp.competitors || [];
      if (!c1 || !c2) continue;
      const codeA = resolveCode(c1), codeB = resolveCode(c2);
      if (!codeA || !codeB) continue;
      const sA = parseInt(c1.score), sB = parseInt(c2.score);
      if (isNaN(sA) || isNaN(sB)) continue;

      // Try to detect a penalty shootout score if ESPN provides one
      let pens = null;
      const shootA = c1.shootoutScore != null ? parseInt(c1.shootoutScore) : NaN;
      const shootB = c2.shootoutScore != null ? parseInt(c2.shootoutScore) : NaN;
      if (!isNaN(shootA) && !isNaN(shootB)) pens = { a: shootA, b: shootB };

      const detailText = ((s?.detail || '') + ' ' + (s?.shortDetail || '') + ' ' + (s?.description || '')).toLowerCase();
      const aet = !!pens || detailText.includes('aet') || detailText.includes('extra time') || detailText.includes('pen');

      out[`${codeA}|${codeB}`] = { goalsA: sA, goalsB: sB, aet, pens };
      out[`${codeB}|${codeA}`] = { goalsA: sB, goalsB: sA, aet, pens: pens ? { a: pens.b, b: pens.a } : null };
    }
    return out;
  }

  // Helper: parse FIFA API results array
  function parseFIFA(results) {
    const out = {};
    for (const m of results) {
      const status = m.MatchStatus ?? m.Status;
      // 0 = finished in FIFA API
      if (status !== 0 && status !== 'Finished') continue;
      const nameA = m.HomeTeam?.ShortClubName || m.Home?.TeamName?.[0]?.Description || '';
      const nameB = m.AwayTeam?.ShortClubName || m.Away?.TeamName?.[0]?.Description || '';
      const codeA = ESPN_NAME_MAP[nameA] || (VALID_CODES.has(nameA) ? nameA : null);
      const codeB = ESPN_NAME_MAP[nameB] || (VALID_CODES.has(nameB) ? nameB : null);
      if (!codeA || !codeB) continue;
      const entry = lookup[`${codeA}|${codeB}`];
      if (!entry) continue;
      const sA = parseInt(m.HomeTeamScore ?? m.Home?.Score ?? -1);
      const sB = parseInt(m.AwayTeamScore ?? m.Away?.Score ?? -1);
      if (isNaN(sA) || sA < 0 || isNaN(sB) || sB < 0) continue;
      out[entry.num] = entry.swap ? { goalsA: sB, goalsB: sA } : { goalsA: sA, goalsB: sB };
    }
    return out;
  }

  // ── Source 1: ESPN single date-range request ────────────────
  try {
    const today = new Date().toISOString().slice(0,10).replace(/-/g,'');
    const url = `https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=20260611-${today}&limit=150`;
    const res = await fetch(url);
    if (res.ok) {
      const data = await res.json();
      const events = data.events || data.sports?.[0]?.leagues?.[0]?.events || [];
      const parsedGroup = parseESPN(events);
      const parsedPairs = parsePairResults(events);
      if (Object.keys(parsedPairs).length > 0) {
        PAIR_RESULTS = { ...PAIR_RESULTS, ...parsedPairs };
      }
      if (Object.keys(parsedGroup).length > 0) {
        REAL_RESULTS = parsedGroup;
        const koCount = Object.keys(PAIR_RESULTS).length / 2;
        sub.textContent = `✅ Live (ESPN): ${Object.keys(REAL_RESULTS).length} group + ${koCount} KO results`;
        return;
      }
    }
  } catch(e) { console.warn('ESPN range fetch failed:', e.message); }

  // ── Source 2: official FIFA API ────────────────────────────
  try {
    const url = `https://api.fifa.com/api/v3/calendar/matches?idCompetition=17&count=200&language=en&from=2026-06-11&to=2026-07-20`;
    const res = await fetch(url, { headers: { 'Origin': 'https://www.fifa.com' } });
    if (res.ok) {
      const data = await res.json();
      const results = data.Results || data.results || data.matches || [];
      const parsed = parseFIFA(results);
      if (Object.keys(parsed).length > 0) {
        REAL_RESULTS = parsed;
        const koCount = Object.keys(PAIR_RESULTS).length / 2;
        sub.textContent = `✅ Live (FIFA): ${Object.keys(REAL_RESULTS).length} group + ${koCount} KO results`;
        return;
      }
    }
  } catch(e) { console.warn('FIFA API fetch failed:', e.message); }

  // ── Source 3: hardcoded fallback ───────────────────────────
  REAL_RESULTS = { ...FALLBACK_RESULTS };
  const koCount = Object.keys(PAIR_RESULTS).length / 2;
  sub.textContent = `⚠️ Using built-in results (${Object.keys(REAL_RESULTS).length} group + ${koCount} KO games)`;
}

// ── Pure xG (no noise) — used for upset factor calibration ───
function calcPureXG(attacker, defender) {
  const ta = T[attacker], td = T[defender];
  const base = 1.15;
  const tacticalEdge = (ta.att - td.def) / 40;
  const fifaBonus    = (50 - ta.fifa) / 200;
  const fifaPenalty  = (td.fifa - 50) / 200;
  const clubEdge     = (ta.clubStr - td.clubStr) / 50;
  const formFactor   = (ta.r - 75) / 100;
  return Math.max(0.15, Math.min(base + tacticalEdge + fifaBonus + fifaPenalty + clubEdge + formFactor, 4.2));
}

// ── Derive upset factor from simulation run outcomes vs reality ─
function calcAutoUpsetFactor() {
  const entries = Object.entries(REAL_RESULTS);
  if (entries.length === 0) return 3;
  let total = 0, upsets = 0;

  entries.forEach(([matchNum, result]) => {
    const sched = GROUP_SCHEDULE[+matchNum];
    if (!sched) return;
    const teams = GROUPS[sched.g];
    const a = teams[sched.t1], b = teams[sched.t2];

    // Run 200 simulations using pure xG (no noise) to find most likely outcome
    const counts = { aWin: 0, bWin: 0, draw: 0 };
    for (let i = 0; i < 200; i++) {
      const gA = poissonGoals(calcPureXG(a, b));
      const gB = poissonGoals(calcPureXG(b, a));
      if      (gA > gB) counts.aWin++;
      else if (gB > gA) counts.bWin++;
      else              counts.draw++;
    }

    // Model's most likely outcome from the simulation runs
    const max = Math.max(counts.aWin, counts.bWin, counts.draw);
    const modelOutcome = counts.aWin === max ? 'aWin'
                       : counts.bWin === max ? 'bWin' : 'draw';

    // Actual outcome (W/D/L only — not the score)
    const actualOutcome = result.goalsA > result.goalsB ? 'aWin'
                        : result.goalsB > result.goalsA ? 'bWin' : 'draw';

    if (modelOutcome !== actualOutcome) upsets++;
    total++;
  });

  return total > 0 ? Math.min(50, Math.round((upsets / total) * 100)) : 3;
}

// All simulation runs synchronously FIRST, then the progress bar
// animates purely cosmetically — no risk of hanging.
async function runSimulation() {
  // Reseed
  _seed = (Math.random() * 0x7fffffff) | 1;
  scorers = {}; assists = {}; SIM = {};

  const overlay = document.getElementById("loadingOverlay");
  const bar     = document.getElementById("progBar");
  const sub     = document.getElementById("progSub");
  overlay.style.display = "flex";
  overlay.style.opacity = "1";
  overlay.classList.remove("hidden");
  document.getElementById("mainContent").style.opacity = "0";

  // Step 1: Fetch live results from the web
  await fetchLiveResults();

  // Step 2: Set default upset factor to 5%
  variance = 5;
  document.getElementById("vSlider").value = 5;
  document.getElementById("vVal").textContent = "5%";

  // Step 3: Run ALL simulation synchronously (fast)
  try {
    runGroups();
    runKnockout();
  } catch(e) {
    console.error("Simulation error:", e);
  }

  // Step 4: Cosmetic progress animation
  const steps = [
    [25,  "Group Stage..."],
    [42,  "Round of 32 · Matches 73–88..."],
    [58,  "Round of 16 · Matches 89–96..."],
    [72,  "Quarter-Finals · Matches 97–100..."],
    [84,  "Semi-Finals · Matches 101–102..."],
    [94,  "Final & Bronze · Matches 103–104..."],
    [100, "Done!"],
  ];
  let step = 0;
  const ticker = setInterval(() => {
    if (step >= steps.length) {
      clearInterval(ticker);
      overlay.style.display = "none";
      const main = document.getElementById("mainContent");
      try { renderAll(); } catch(e) { console.error("Render error:", e); }
      window.scrollTo(0, 0);
      main.style.opacity = "1";
      return;
    }
    bar.style.width = steps[step][0] + "%";
    sub.textContent = steps[step][1];
    step++;
  }, 200);
}

    c.innerHTML=`<h3>${title}</h3>`+data.map(([p,v],i)=>{
      const tm=src[p+'_t'];
      return `<div class="stat-row"><span class="stat-rank">${i+1}</span><span>${tm?T[tm].flag:''}</span><span class="stat-player">${p}</span><span class="stat-country">${tm?T[tm].name:''}</span><span class="stat-val">${v}</span></div>`;
    }).join("");
    return c;
  };
  grid.appendChild(makeCard("⚽ Top Scorers",topS,scorers));
  grid.appendChild(makeCard("🎯 Top Assists",topA,assists));
}

window.addEventListener("load",()=>setTimeout(runSimulation,150));
</script>

</body>
</html>
